<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080808"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <!-- Red accent bar -->
  <rect x="80" y="80" width="4" height="100" rx="2" fill="#C8102E"/>
  <!-- Name -->
  <text x="104" y="148" font-family="Georgia, serif" font-size="72" font-weight="700" fill="white">ธนวัฒน์ โลวิทยาโอฬาร</text>
  <!-- Role -->
  <text x="104" y="210" font-family="Arial, sans-serif" font-size="28" fill="#999999">Content Creator · Producer · Business Analyst</text>
  <!-- Tagline -->
  <text x="104" y="310" font-family="Georgia, serif" font-size="36" fill="#ffffff" font-style="italic">"เปลี่ยนความคิดให้เป็นการกระทำ"</text>
  <!-- Bottom label -->
  <rect x="104" y="500" width="320" height="44" rx="6" fill="#C8102E" fill-opacity="0.15"/>
  <rect x="104" y="500" width="320" height="44" rx="6" fill="none" stroke="#C8102E" stroke-opacity="0.3" stroke-width="1"/>
  <text x="264" y="528" font-family="Arial, sans-serif" font-size="16" fill="#C8102E" text-anchor="middle" font-weight="600">สมัคร The Standard / The Secret Sauce</text>
  <!-- T logo -->
  <rect x="1060" y="80" width="60" height="60" rx="8" fill="#C8102E"/>
  <text x="1090" y="122" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">T</text>
</svg>
